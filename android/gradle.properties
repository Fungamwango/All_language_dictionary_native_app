org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The website folder whose index.html, css, js, every dictionary/*.js and
# api/api.js are bundled into the app as offline assets on every build.
WEB_ROOT=C:/others/prog/all-languages-dictionary

# The live website the app opens. Online, every page file comes from here (and is
# stored for offline use); offline, the stored copy or the bundled one is served.
SITE_HOST=alldic.pages.dev
